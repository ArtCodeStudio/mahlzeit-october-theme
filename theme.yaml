        # jumplink-snippet-gallery
            page_historie_galleries:
                tab: 'Gallery'
                label: Gallery
                type: repeater
                prompt: Create Gallery
                comment: Create a new gallery
                span: left
                form:
                    fields:
                        title:
                            label: Title
                            type: text
                            comment: Write a title to show in the gallery
                            span: left
                        handle:
                            label: handle
                            type: text
                            required: true
                            comment: Define a handle for this gallery to use this gallery in a snippet. <span class="text-danger">Please write everything in lowercase and do not use blank or special characters</span>. 
                            commentHtml: true
                            span: right
                        type:
                            label: Type
                            type: dropdown
                            comment: Type of gallery
                            span: left
                            options:
                                grid: Grid
                                slide_scrollbar: Slide with Scrollbar (horizontal)
                            default: grid
                        description:
                            label: Description
                            type: richeditor
                            size: small
                            toolbarButtons: fullscreen|bold|italic|underline|strikeThrough|subscript»superscript|fontSize|color|inlineStyle|paragraphStyle|paragraphFormat|align|formatOL|formatUL|outdent|indent|quote|insertHR|-|insertLink|insertImage|insertVideo|insertAudio|insertFile|insertTable|undo|redo|clearFormatting|html
                            comment: Write a description to show in the gallery
                            span: full
                        images:
                            label: Images
                            type: repeater
                            required: true
                            comment: Upload images to your gallery
                            prompt: Add image
                            span: full
                            form:
                                fields:
                                    image:
                                        label: Image file
                                        type: mediafinder
                                        mode: image
                                        span: left
                                    alt:
                                        label: alt
                                        type: text
                                        comment: Write a brief description of this image to improve search engine optimization (SEO) and accessibility for visually impaired customers.
                                        span: right
                                    # w:
                                    #     label: width
                                    #     type: number
                                    #     required: true
                                    #     comment: Image width
                                    #     span: right
                                    # h:
                                    #     label: height
                                    #     type: number
                                    #     required: true
                                    #     comment: Image height
                                    #     span: right
                                    ratio:
                                        label: aspect ratio
                                        type: number
                                        comment: Aspect ratio e.g. 1:1, leaf it blank if you do not want to use this 
                                        span: right
                                    title:
                                        label: Image title text
                                        type: text
                                        comment: Write a title to show in the image
                                        span: right
                                    description:
                                        label: Image description text
                                        type: richeditor
                                        size: small
                                        toolbarButtons: bold|italic|underline
                                        comment: Write a description to show in the image
                                        span: full
        # flipbooks
            flipbooks_collection:
                tab: 'Flipbooks'
                label: Flipbooks Collection
                type: repeater
                prompt: Create a flipbook collection
                comment: Create a new flipbook collection
                span: full
                form:
                    fields:
                        flipbooks:
                            label: Flipbooks
                            type: repeater
                            prompt: Create Flipbook
                            comment: Create a new Flipbook for this collection
                            span: left
                            form:
                                fields:
                                    show:
                                        label: Show
                                        type: checkbox
                                        default: true
                                    name:
                                        label: Name
                                        type: text
                                    w:
                                        label: Pages width
                                        type: number
                                        required: true
                                        comment: Width of the pages in the book (in pixels).
                                        span: left
                                        default: 1241
                                    h:
                                        label: Pages height
                                        type: number
                                        required: true
                                        comment: Height of the pages in the book (in pixels).
                                        span: right
                                        default: 1754
                                    pages:
                                        label: Pages
                                        type: repeater
                                        required: true
                                        comment: Upload pages to your flipboard
                                        prompt: Add page
                                        span: full
                                        form:
                                            fields:
                                                image:
                                                    label: Image file
                                                    type: mediafinder
                                                    mode: image
                                                    span: left
                                                alt:
                                                    label: alt
                                                    type: text
                                                    comment: Write a brief description of this image to improve search engine optimization (SEO) and accessibility for visually impaired customers.
                                                    span: right
                        handle:
                            label: Handle
                            type: text
                            comment: Handle to identify the flipbook collection in the snippet
                            span: right
                        background:
                            label: Background image file
                            type: mediafinder
                            mode: image
                            comment: Background image of the flipbook collection
                            span: right
        # Tabs
            tabs_collection:
                tab: 'Tabs'
                label: Tabs Collection
                type: repeater
                prompt: Create Tab Collection
                comment: Create a new tab collection
                span: left
                form:
                    fields:
                        handle:
                            label: handle
                            type: text
                            required: true
                            comment: Define a handle for this tabs collection to use this tabs in a snippet. <span class="text-danger">Please write everything in lowercase and do not use blank or special characters</span>. 
                            commentHtml: true
                            span: right
                        tabs:
                            label: Tab
                            type: repeater
                            required: true
                            comment: Create a new tab for this tabs collection
                            prompt: Add tab
                            span: full
                            form:
                                fields:
                                    label:
                                        label: Label
                                        type: text
                                        comment: Label of the tab to click
                                        span: left
                                    galleryHandle:
                                        label: Gallery Handle
                                        type: text
                                        comment: Handle of the gallery if you want to display a slideshow in this tab
                                        span: right
                                    contentFilename:
                                        label: Content Filename
                                        type: text
                                        comment: Filename of the content you want to display in this tab
                                        span: full

