<h2 style="text-align: center;">Kinderpreise bei Mahlzeit am Meer</h2>

<p style="text-align: center;">Qualität und Fairness stehen bei uns an erster Stelle – auch für unsere jungen Gäste. Wir berechnen die Speisen für Kinder auf Basis einer einfachen und übersichtlichen Regelung: 1 € pro Lebensjahr des Kindes. Diese Regelung gilt bis einschließlich 12 Jahren.</p>
