[viewBag]
==
<div
    rv-if="images | empty | not"
>
    <div rv-if="headerTitle | or headerText" rv-class="containerClass | append ' pt-5 pb-4'">
        <div class="row">
            <div class="col-12 col-md-6">
                <h2 class="hyphenate text-second" rv-html="headerTitle"></h2>
                <p rv-html="headerText"></p>
            </div>
        </div>
    </div>

    <div class="container-fluid pb-5 px-3">
        <div class="row images-row align-items-center">
            <div class="image-col col-12 col-md-4 col-lg-2 my-1" rv-each-image="images">
                <rv-img
                    src="image.src"
                    alt="image.title"
                    width="image.w"
                    height="image.h"
                    visible-only="true"
                    rv-data-index="%image%"
                    rv-on-click="onThumbnailsClick"
                ></rv-img>
            </div>
        </div>
    </div>
    
    
    <rv-photoswipe handle="event.id" images="images"></rv-photoswipe>
</div>
