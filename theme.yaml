name: mahlzeit-october-theme
description: 'October Bootstrap 4 Theme by JumpLink'
author: 'Pascal Garber <pascal.jumplink.eu>'
homepage: 'https://www.jumplink.eu'
code: mahlzeit-october-theme
license: MIT
form:
    tabs:
        fields:
        # general
            site_name:
                label: 'Site name'
                type: text
                comment: 'Name of your site'
                default: ''
                tab: General
            site_business:
                label: 'Site Business'
                type: text
                comment: 'Describe your business with one word'
                default: ''
                tab: General
            site_desc:
                label: 'Site description'
                type: text
                comment: 'Describe your site in one sentence'
                default: ''
                tab: General
            phone_number:
                label: Phone
                type: text
                comment: 'Phone number'
                default: '1234 - 5678910'
                tab: General
            email_address:
                label: Email
                type: text
                comment: 'Email address for contact form and imprint'
                default: hello@yoursite.de
                tab: General
            site_webaddress:
                label: 'Site Webaddress'
                type: text
                comment: 'The main address for this site'
                default: 'www.yoursite.de'
                tab: General
            owner_name:
                label: 'Owner Name'
                type: text
                comment: 'The name of the owner of this site'
                default: 'Owners Name '
                tab: General
            street:
                label: Street
                type: text
                comment: 'The street for contact and location'
                default: 'Owners Street 6'
                tab: General
            city:
                label: 'Place, location or city'
                type: text
                default: 'Super City'
                tab: General
            zip:
                label: Zip
                type: text
                comment: 'zip code, postal code'
                default: 520
                tab: General
            country:
                label: Country
                type: text
                comment: 'country, land, state, shore, ground, province'
                default: Deutschland
                tab: General
        # favicons
            theme_color:
                label: 'Theme color'
                type: colorpicker
                comment: '<br><br><br>Color of the <a href="https://developers.google.com/web/updates/2015/08/using-manifest-to-set-sitewide-theme-color" target="_blank">browser address bar on Smartpohnes</a>.'
                commentHtml: true
                default: '#ffffff'
                tab: Favicons
            tile_color:
                label: 'Tile color'
                type: colorpicker
                comment: '<br><br><br>Color of the <a href="https://docs.microsoft.com/en-us/windows-hardware/customize/desktop/unattend/microsoft-windows-helpandsupport-helpandsupport-tilecolor" target="_blank">tile on Windows Phone</a>.'
                commentHtml: true
                default: '#ffffff'
                tab: Favicons
            mask_color:
                label: 'Mask color'
                type: colorpicker
                comment: '<br><br><br>Color of the <a href="https://steemit.com/deutsch/@rilc0n/icon-fuer-angepinnte-tabs-in-safari-erstellen" target="_blank">icon on Safari</a>.'
                commentHtml: true
                default: '#ffffff'
                tab: Favicons
        # navigation
            navigation_navbar_type:
                label: Navbar Type
                type: dropdown
                options:
                    default: 'Default'
                    center_logo: 'Center Logo'
                    only_sidebar: 'Only Sidebar'
                default: 'default'
                tab: Navigation
            navigation_navbar_background_color:
                label: Navbar Background Color
                type: dropdown
                options:
                    dark: 'dark'
                    light: 'light'
                    white: 'white'
                    primary: 'primary'
                    secondary: 'secondary'
                    success: 'success'
                    danger: 'danger'
                    warning: 'warning'
                    info: 'info'
                default: 'transparent'
                tab: Navigation
                assetVar: navigation_navbar_background_color
            navigation_navbar_background_transparency:
                label: Navbar Background Transparency
                type: number
                default: 0.1
                tab: Navigation
                assetVar: navigation_navbar_background_transparency
            navigation_navbar_color:
                label: Navbar Nav Elements Color
                type: dropdown
                options:
                    dark: 'dark'
                    light: 'light'
                default: 'light'
                tab: Navigation
            navigation_left_sidebar_enabled:
                label: Enable left sidebar
                type: checkbox
                default: 1
                tab: Navigation
            navigation_right_sidebar_enabled:
                label: Enable right sidebar
                type: checkbox
                default: 0
                tab: Navigation
            navigation_top_sidebar_enabled:
                label: Enable top sidebar
                type: checkbox
                default: 0
                tab: Navigation
        # jumplink-snippet-content-button-row
            content_button_row:
                tab: 'Content / Button Row'
                label: Content / Button Row
                type: repeater
                prompt: Create Row
                comment: Create a new row with content or Button
                span: left
                form:
                    fields:
                        handle:
                            label: Handle
                            type: text
                            comment: Handle to identify the row in the snippet
                        container_class:
                            label: Container
                            type: dropdown
                            comment: Container class, <a href="https://getbootstrap.com/docs/4.0/layout/overview/#containers" target="_blank">show bootstrap docs for more information</a>.
                            commentHtml: true
                            span: left
                            options:
                                container: Limited width (.container) 
                                container-fluid: Full width (.container-fluid)
                            default: container
                        horizontal_alignment_section:
                            label: Horizontal alignment
                            type: section
                            comment: How should the columns be arranged? <a href="https://getbootstrap.com/docs/4.0/layout/grid/#horizontal-alignment" target="_blank">More about layout on Bootstrap</a>.
                            commentHtml: true
                        justify_xs:
                            label: Justify on extra small devices 
                            type: dropdown
                            span: left
                            options:
                                justify-content-center: center
                                justify-content-start: start
                                justify-content-end: end
                                justify-content-between: space between
                                justify-content-around: space around
                            default: justify-content-center
                        justify_sm:
                            label: Justify on small devices 
                            type: dropdown
                            span: right
                            options:
                                justify-content-sm-center: center
                                justify-content-sm-start: start
                                justify-content-sm-end: end
                                justify-content-sm-between: space between
                                justify-content-sm-around: space around
                            default: justify-contentt-sm-center
                        justify_md:
                            label: Justify on medium devices 
                            type: dropdown
                            span: left
                            options:
                                justify-content-md-center: center
                                justify-content-md-start: start
                                justify-content-md-end: end
                                justify-content-md-between: space between
                                justify-content-md-around: space around
                            default: justify-contentt-md-center
                        justify_lg:
                            label: Justify on large devices 
                            type: dropdown
                            span: right
                            options:
                                justify-content-lg-center: center
                                justify-content-lg-start: start
                                justify-content-lg-end: end
                                justify-content-lg-between: space between
                                justify-content-lg-around: space around
                            default: justify-contentt-lg-center
                        justify_xl:
                            label: Justify on extra large devices 
                            type: dropdown
                            span: left
                            options:
                                justify-content-xl-center: center
                                justify-content-xl-start: start
                                justify-content-xl-end: end
                                justify-content-xl-between: space between
                                justify-content-xl-around: space around
                            default: justify-contentt-xl-center
                        column:
                            label: Column Item
                            type: repeater
                            prompt: Create Column Item
                            comment: Create a new column with content or Button
                            form:
                                fields:
                                    column_item_section:
                                        label:  'Content / Button Column Item'
                                        type: section
                                    content:
                                        label: Enable
                                        type: checkbox
                                        comment: Do you want to embed a content file? 
                                    contentFilename:
                                        label: Content Filename
                                        type: text
                                        comment: Filename of the content you want to display
                                    button_section:
                                        label: Button
                                        type: section
                                        comment: Configure your button
                                    button:
                                        label: Enable
                                        type: checkbox
                                        comment: Do you want to embed a button? 
                                    button_style:
                                        label: Button style
                                        type: dropdown
                                        comment: Button style, <a href="https://getbootstrap.com/docs/4.0/components/buttons/" target="_blank">show bootstrap docs for more information</a>.
                                        commentHtml: true
                                        span: left
                                        options:
                                            btn-primary: Primary
                                            btn-secondary: Secondary
                                            btn-success: Success
                                            btn-danger: Danger
                                            btn-warning: Warning
                                            btn-info: Info
                                            btn-light: Light
                                            btn-dark: Dark
                                            btn-link: Link
                                            btn-outline-primary: Outline Primary
                                            btn-outline-secondary: Outline Secondary
                                            btn-outline-success: Outline Success
                                            btn-outline-danger: Outline Danger
                                            btn-outline-warning: Outline Warning
                                            btn-outline-info: Outline Info
                                            btn-outline-light: Outline Light
                                            btn-outline-dark: Outline Dark
                                            btn-outline-dashed-dark: Outline Dashed Dark
                                        default: auto
                                    button_alignment:
                                        label: Alignment
                                        type: dropdown
                                        comment: Button alignment, <a href="https://getbootstrap.com/docs/4.0/utilities/text/#text-alignment" target="_blank">show bootstrap docs for more information</a>.
                                        commentHtml: true
                                        span: right
                                        options:
                                            text-left: Left aligned button
                                            text-center: Center button
                                            text-justify: Justify button
                                            text-right: Right aligned button
                                    button_label:
                                        label: Label
                                        type: text
                                        span: left
                                    button_url:
                                        label: Url
                                        type: text
                                        span: right
                                    spacing_section:
                                        label: Spacing
                                        type: section
                                        comment: Add spaces to the column, <a href="https://getbootstrap.com/docs/4.0/utilities/spacing/" target="_blank">More on Bootstrap</a>.
                                        commentHtml: true
                                    spacing_top:
                                        label: Spacing top
                                        type: dropdown
                                        span: left
                                        options:
                                            mt-0: none
                                            mt-1: small
                                            mt-2: little
                                            mt-3: medium
                                            mt-4: more
                                            mt-5: big
                                    spacing_bottom:
                                        label: Spacing bottom
                                        type: dropdown
                                        span: left
                                        options:
                                            mb-0: none
                                            mb-1: small
                                            mb-2: little
                                            mb-3: medium
                                            mb-4: more
                                            mb-5: big
                                    column_section:
                                        label: Column
                                        type: section
                                        comment: How much width should the columns have? <a href="https://getbootstrap.com/docs/4.0/layout/grid/#grid-options" target="_blank">More about layout on Bootstrap</a>.
                                        commentHtml: true
